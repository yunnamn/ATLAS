name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: ./scripts/setup.sh
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check . && .venv/bin/mypy atlas && .venv/bin/pytest -q
        working-directory: backend
      - run: .venv/bin/python -m atlas.research.evaluate
        working-directory: backend
      - run: .venv/bin/python -m atlas.research.benchmark --output /tmp/atlas-benchmark.json
        working-directory: backend
      - run: npm run check && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: PLAYWRIGHT_BROWSERS_PATH=/tmp/atlas-playwright npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
